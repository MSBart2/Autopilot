function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function inlineMarkdown(text) {
  let s = escapeHtml(text);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code class="prose-code">$1</code>');
  return s;
}

function cleanAgentOutput(text) {
  // Remove fenced json code blocks
  let out = text.replace(/```(?:json)?\s*\n[\s\S]*?\n```/gi, '');

  // Ensure ## headers start on their own line
  out = out.replace(/([^\n])(#{2,4} )/g, '$1\n\n$2');

  // Split common tool-call interjections onto their own lines when concatenated
  out = out.replace(/(?<=[^\n])(Good\.|Great\.|Perfect\.|Right\.|Excellent\.|Noted\.|Let me |Now let me )/g, '\n$1');

  // Drop everything before first ## header
  const firstHeader = out.search(/^#{2,4} /m);
  if (firstHeader > 0) out = out.slice(firstHeader);

  // Filter short tool-call interjection lines
  out = out.split('\n').filter(line => {
    const t = line.trim();
    if (!t) return true;
    if (t.startsWith('#')) return true;
    if (t.startsWith('|')) return true;
    if (/^[-*]\s/.test(t)) return true;
    if (t.startsWith('`')) return true;
    if (t.length < 120 && /^(Good\.?|Great\.?|Perfect\.?|Right\.?|Excellent\.?|Noted\.?|Let me|Now let me|Moving on|I'll now|I can see|I need to|Looking at|Starting with|Checking|Next,|First,?\s+I)/i.test(t)) return false;
    return true;
  }).join('\n');

  return out.trim();
}

function renderMarkdownLite(text) {
  const lines = text.split(/\r?\n/);
  let inList = false;
  const html = [];
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) { if (inList) { html.push('</ul>'); inList = false; } continue; }
    const heading = /^(#{2,4})\s+(.+)$/.exec(t);
    if (heading) {
      if (inList) { html.push('</ul>'); inList = false; }
      html.push(`<h3>${inlineMarkdown(heading[2])}</h3>`);
      continue;
    }
    if (t.startsWith('|') && t.endsWith('|')) {
      const tls = [];
      while (i < lines.length) {
        const tl = lines[i].trim();
        if (!tl.startsWith('|') || !tl.endsWith('|')) break;
        tls.push(tl); i++;
      }
      i--;
      if (inList) { html.push('</ul>'); inList = false; }
      const rows = tls
        .filter(tl => !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(tl))
        .map(tl => tl.slice(1,-1).split('|').map(c => c.trim()));
      if (rows.length > 0) {
        const [header, ...body] = rows;
        html.push('<table class="output-table"><thead><tr>');
        html.push(header.map(c => `<th>${inlineMarkdown(c)}</th>`).join(''));
        html.push('</tr></thead><tbody>');
        html.push(body.map(r => `<tr>${r.map(c => `<td>${inlineMarkdown(c)}</td>`).join('')}</tr>`).join(''));
        html.push('</tbody></table>');
      }
      continue;
    }
    const bullet = /^[-*]\s+(.+)$/.exec(t);
    if (bullet) {
      if (!inList) { html.push('<ul>'); inList = true; }
      html.push(`<li>${inlineMarkdown(bullet[1])}</li>`);
      continue;
    }
    if (inList) { html.push('</ul>'); inList = false; }
    html.push(`<p>${inlineMarkdown(t)}</p>`);
  }
  if (inList) html.push('</ul>');
  return `<div class="output-markdown">${html.join('')}</div>`;
}

function tryReadSummaryObject(text) {
  const fenced = /```(?:json)?\s*\n(\{[\s\S]*?\})\s*\n```/i.exec(text);
  if (fenced) { try { const o = JSON.parse(fenced[1]); if (o?.status) return o; } catch {} }
  const blocks = text.split(/\n\s*\n/);
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i].trim();
    if (b.startsWith('{') && b.endsWith('}')) { try { const o = JSON.parse(b); if (o?.status) return o; } catch {} }
  }
  const s = text.indexOf('{'), e = text.lastIndexOf('}');
  if (s >= 0 && e > s) { try { const o = JSON.parse(text.slice(s, e+1)); if (o?.status) return o; } catch {} }
  return null;
}

];

function renderEvidencePanel(summaryEvidence, showPanel) {
  if (!showPanel) return '';
  // Merge DB evidence + summary's evidence[] array (if any), deduping by name
  const seen = new Set();
  const items = [];
  for (const e of DB_EVIDENCE) {
    if (!seen.has(e.name)) { seen.add(e.name); items.push(e); }
  }
  if (Array.isArray(summaryEvidence)) {
    for (const e of summaryEvidence) {
      const name = e.name ?? e.Name ?? '';
      if (!seen.has(name)) {
        seen.add(name);
        items.push({ kind: 'stage-evidence', name, summary: e.summary ?? e.Summary ?? '' });
      }
    }
  }
  if (!items.length) return '';
  const cards = items.map(e => {
    const kindCls = e.kind === 'policy-rationale' ? 'kind-policy' : '';
    return `<article class="evidence-card ${kindCls}">
      <span class="evidence-card-name">${escapeHtml(e.name)}</span>
      <p class="evidence-card-summary">${escapeHtml(e.summary)}</p>
    </article>`;
  }).join('');
  return `<div class="evidence-panel">
    <div class="evidence-panel-header open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">
      <span class="ep-title">Evidence &amp; Findings</span>
      <span style="display:flex;align-items:center;gap:.4rem">
        <span class="ep-count">${items.length}</span>
        <span class="ep-chevron">&#8964;</span>
      </span>
    </div>
    <div class="evidence-panel-body">${cards}</div>
  </div>`;
}

function chip(text, cls){ return `<span class="chip ${cls}">${escapeHtml(text)}</span>`; }

function difficultyChip(v) {
  const cls = v === 'hard' ? 'chip-hard' : v === 'medium' ? 'chip-medium' : 'chip-neutral';
  return chip(v, cls);
}
function priorityChip(v) {
  const cls = v === 'critical' ? 'chip-critical' : v === 'high' ? 'chip-high' : 'chip-neutral';
  return chip(v, cls);
}

function renderSummary(summary) {
  const status = String(summary.status ?? 'unknown').toLowerCase();
  const titles = { stop: '🚫 Investigation Halted', duplicate: '🔁 Duplicate Located', go: '✅ Case Cleared' };
  const statusTitle = titles[status] ?? 'Agent Result';
  const statusChipCls = status === 'go' ? 'chip-go' : status === 'stop' ? 'chip-stop' : 'chip-neutral';

  // Row 1: verdict + status
  const verdictRow = `<div class="output-verdict status-${escapeHtml(status)}">
    <strong>${escapeHtml(statusTitle)}</strong>
    ${chip(String(summary.status ?? 'UNKNOWN'), statusChipCls)}
  </div>`;

  // Row 2: type / difficulty / priority / model tier — all as chips
  const meta = [];
  if (summary.type) meta.push(chip(summary.type, 'chip-neutral'));
  if (summary.difficulty) meta.push(difficultyChip(summary.difficulty));
  if (summary.priority) meta.push(priorityChip(summary.priority));
  if (summary.recommended_model_tier) meta.push(chip('model: ' + summary.recommended_model_tier, 'chip-neutral'));
  const metaRow = meta.length ? `<div class="summary-chips-row"><span class="summary-section-label">classification</span>${meta.join('')}</div>` : '';

  // Row 3: agents
  const agents = Array.isArray(summary.agents) ? summary.agents : [];
  const agentsRow = agents.length ? `<div class="summary-chips-row"><span class="summary-section-label">agents</span>${agents.map(a => chip(a, 'chip-agent')).join('')}</div>` : '';

  // Row 4: scope
  const scope = Array.isArray(summary.scope) ? summary.scope : [];
  const scopeRow = scope.length ? `<div class="summary-chips-row"><span class="summary-section-label">scope</span>${scope.map(s => chip(s, 'chip-scope')).join('')}</div>` : '';

  // Row 5: related numbers as neutral chips
  const related = [...(summary.related_issues ?? []), ...(summary.related_prs ?? [])];
  const relatedRow = related.length ? `<div class="summary-chips-row"><span class="summary-section-label">related</span>${related.map(r => chip('#' + r, 'chip-neutral')).join('')}</div>` : '';

  return `<div class="output-summary">${verdictRow}${metaRow}${agentsRow}${scopeRow}${relatedRow}</div>`;
}

function buildDiff(original, cleaned) {
  const cleanedSet = new Set(cleaned.split('\n'));
  return original.split('\n').map(l => {
    if (!l.trim()) return `<span class="diff-blank">  ·</span>`;
    if (cleanedSet.has(l)) return `<span class="diff-kept">+ ${escapeHtml(l.slice(0,150))}</span>`;
    return `<span class="diff-removed">− ${escapeHtml(l.slice(0,150))}</span>`;
  }).join('');
}

function render() {
  const raw = document.getElementById('raw-input').value;
  const doClean   = document.getElementById('chk-clean').checked;
  const showNarr  = document.getElementById('chk-narrative').checked;
  const showVerdict = document.getElementById('chk-verdict').checked;
  const showRaw   = document.getElementById('chk-raw-collapse').checked;
  const showEvidence = document.getElementById('chk-evidence').checked;
  const showDiff  = document.getElementById('chk-diff').checked;

  const pane = document.getElementById('render-pane');
  const info = document.getElementById('info');

  const summary = tryReadSummaryObject(raw);
  const cleaned = doClean ? cleanAgentOutput(raw) : raw;
  const hasNarrative = /^#{2,4} /m.test(cleaned);

  let html = '';

  if (showDiff && doClean) {
    html += `<div style="margin-bottom:.6rem;font-size:.7rem;color:#94a3b8;border-bottom:1px solid #21262d;padding-bottom:.35rem"><span style="color:#4ade80">+ kept</span> &nbsp; <span style="color:#f87171">− removed</span></div>`;
    html += `<div style="line-height:1.7">${buildDiff(raw, cleaned)}</div>`;
  } else {
    if (showNarr && hasNarrative) {
      const narrativeId = 'narrative-body';
      const narrativeHtml = summary ? `<div class="output-narrative">${renderMarkdownLite(cleaned)}</div>` : renderMarkdownLite(cleaned);
      if (summary) {
        // Collapsed by default when we have a verdict card
        html += `<span class="narrative-toggle" onclick="const b=document.getElementById('${narrativeId}');const open=b.style.display==='block';b.style.display=open?'none':'block';this.textContent=open?'▸ Show full case narrative':'▾ Hide case narrative'">▸ Show full case narrative</span>`;
        html += `<div id="${narrativeId}" class="narrative-collapsed">${narrativeHtml}</div>`;
      } else {
        html += narrativeHtml;
      }
    }
    if (summary && showVerdict) {
      html += renderSummary(summary);
      html += renderEvidencePanel(summary.evidence, showEvidence);
    }
    if (showRaw) {
      html += `<details class="output-details"><summary>Raw transcript (${raw.length.toLocaleString()} chars)</summary><pre class="output-raw">${escapeHtml(raw)}</pre></details>`;
    }
    if (!html.trim()) {
      html = `<pre class="output-raw">${escapeHtml(cleaned || raw)}</pre>`;
    }
  }

  pane.innerHTML = html;

  const rawLines = raw.split('\n').length;
  const cleanLines = cleaned.split('\n').length;
  info.textContent = `Raw: ${raw.length.toLocaleString()} chars (${rawLines} lines) → Cleaned: ${cleaned.length.toLocaleString()} chars (${cleanLines} lines) — ${rawLines - cleanLines} lines removed — Summary: ${summary ? summary.status.toUpperCase() : 'not detected'}`;
}

function resetInput() {
  document.getElementById('raw-input').value = HARDCODED;
  render();
}

function copyClean() {
  const raw = document.getElementById('raw-input').value;
  navigator.clipboard.writeText(cleanAgentOutput(raw));
}

document.getElementById('raw-input').addEventListener('input', render);
['chk-clean','chk-narrative','chk-verdict','chk-raw-collapse','chk-evidence','chk-diff'].forEach(id =>

);
