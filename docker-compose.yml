# Docker Compose for the minimal Cyberpilot web portal

services:
  Cyberpilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - Cyberpilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  Cyberpilot-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["dotnet", "watch", "run", "--project", "web/Cyberpilot.Web.csproj", "--urls", "http://0.0.0.0:8080"]
    working_dir: /src
    volumes:
      - ./:/src
    ports:
      - "5556:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    networks:
      - Cyberpilot-network

networks:
  Cyberpilot-network:
    driver: bridge
