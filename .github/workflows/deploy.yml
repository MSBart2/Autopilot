name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.cshtml'
      - '**.razor'
      - '**/appsettings*.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

env:
  AZURE_WEBAPP_NAME: "Cyberpilot-app" # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"
  DOTNET_VERSION: "9.0.x"
  DOCKER_REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout source (for Docker context)
        uses: actions/checkout@v4

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./publish

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get git revision
        id: revision
        run: |
          REVISION=$(git rev-parse HEAD)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "Revision: $REVISION"

      - name: Log in to Container Registry
        if: ${{ env.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && env.GHCR_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLISHED_DIR=./publish
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.revision.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Uncomment when Azure Web App is configured
      # - name: Deploy to Azure Web App
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: ${{ env.AZURE_WEBAPP_NAME }}
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      #     package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deployment Info
        run: |
          echo "🚀 Ready to deploy to production"
          echo "📦 Package location: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
          echo "🐳 Docker image available at: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo ""
          echo "💡 To enable Azure deployment:"
          echo "   1. Set AZURE_WEBAPP_NAME environment variable"
          echo "   2. Add AZURE_WEBAPP_PUBLISH_PROFILE secret"
          echo "   3. Uncomment the azure/webapps-deploy step"

  notify:
    runs-on: ubuntu-latest
    needs: [build, docker, deploy-azure]
    if: always()

    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-azure.result }}" == "success" ]; then
            echo "✅ Deployment successful"
          elif [ "${{ needs.deploy-azure.result }}" == "skipped" ]; then
            echo "⏭️ Deployment skipped (not main branch)"
          else
            echo "❌ Deployment failed"
          fi
